[package]
name = "rode-hid"
description = "Control RØDE Wireless ME and AI-Micro over USB HID, without RØDE Central"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["rode", "hid", "usb", "microphone", "wireless"]
categories = ["hardware-support"]

[features]
clap = ["dep:clap"]

[dependencies]
clap = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
hidapi = { workspace = true, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { workspace = true, features = ["linux-native-basic-udev"] }

[lints]
workspace = true
